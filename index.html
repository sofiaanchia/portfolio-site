<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofia Ramirez Anchia</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 4rem 1.5rem;
    line-height: 1.6;
    background: #fafafa;
    color: #1a1a1a;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
  }
  p.subtitle {
    color: #555;
    margin-top: 0;
  }
  .links {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }
  .links a {
    display: inline-block;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid #1a1a1a;
    color: #1a1a1a;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    background: #1a1a1a;
    color: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    p.subtitle { color: #aaa; }
    .links a { border-color: #eee; color: #eee; }
    .links a:hover { background: #eee; color: #111; }
  }
</style>
</head>
<body>
  <h1>Sofia Ramirez Anchia</h1>
  <p class="subtitle">This is a work-in-progress personal site &mdash; more coming soon.</p>

  <div class="links">
    <a href="https://www.linkedin.com/in/sofia-ramirez-anchia" target="_blank" rel="noopener">LinkedIn</a>
    <a href="resume.pdf" target="_blank" rel="noopener">Resume (PDF)</a>
  </div>
</body>
</html>
